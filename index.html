 <!DOCTYPE html>
<html>
<head>
    <title>XADOK.REX - Music Search</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            display: inline-block;
            border-radius: 12px;
        }

        input {
            padding: 12px;
            width: 250px;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #16a34a;
        }

        p {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>XADOK.REX 🎵</h1>
        <p>Search your favorite music instantly</p>

        <div class="box">

            <input id="query" placeholder="Type song or artist...">

            <br>

            <button onclick="searchMusic()">Search Music</button>

        </div>

    </div>
<script>
    const SEARCH_ENGINE = "https://tubidy.cc/search/";

    function searchMusic() {
        let query = document.getElementById("query").value;

        if (query === "") {
            alert("Type a song or artist!");
            return;
        }

        // SEAMLESS SEARCH (no second typing)
        let finalURL = SEARCH_ENGINE + encodeURIComponent(query);

        window.location.href = SEARCH_ENGINE + encodeURIComponent(query);
    }
</script>
   
</body>
</html>
